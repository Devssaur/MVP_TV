{% extends "base.html" %}

{% block title %}Fila CCM{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
{% endblock %}

{% block toolbar_nav %}
<a href="/filaccm" class="nav-tab active">Fila de Análise</a>
{% endblock %}

{% block content %}
<div class="page-wrapper ccm-wrapper">

  <div class="page-header">
    <div>
      <p class="page-title">Fila de Análise do CCM-E</p>
    </div>
    <span id="last-sync" style="font-size:.75rem;color:var(--text-muted);align-self:center;"></span>
  </div>

  <!-- Filter tabs -->
  <div class="filter-bar">
    <button class="filter-tab active" data-filter="PENDENTES">Pendentes</button>
    <button class="filter-tab" data-filter="TODAS">Todas</button>
    <button class="filter-tab" data-filter="APROVADA">Aprovadas</button>
    <button class="filter-tab" data-filter="DUPLICADA">Duplicadas</button>
    <button class="filter-tab" data-filter="CANCELADA">Canceladas</button>
  </div>

  <!-- Equipment filter -->
  <div class="equip-filter-bar ccm-advanced-filters">
    <div class="ccm-filter-item">
      <label class="equip-filter-label" for="line-filter">Linha</label>
      <select id="line-filter" class="equip-filter-select">
        <option value="">Todas as linhas</option>
      </select>
    </div>

    <div class="ccm-filter-item">
      <label class="equip-filter-label" for="station-filter">Estação</label>
      <select id="station-filter" class="equip-filter-select">
        <option value="">Todas as estações</option>
      </select>
    </div>

    <div class="ccm-filter-item">
      <label class="equip-filter-label" for="order-number-filter">Numero da ordem</label>
      <input id="order-number-filter" class="equip-filter-select" type="search" placeholder="Ex: 4101234567">
    </div>

    <div class="ccm-filter-item" id="approved-occurrence-filter-wrap" style="display:none;">
      <label class="equip-filter-label" for="approved-occurrence-filter">N° da ocorrência</label>
      <input id="approved-occurrence-filter" class="equip-filter-select" type="search" placeholder="Ex: 123456">
    </div>

    <div class="ccm-filter-item">
      <label class="equip-filter-label" for="date-range-filter">Periodo</label>
      <input id="date-range-filter" class="equip-filter-select ccm-date-range-input" type="text" placeholder="Selecione o intervalo de datas" readonly>
    </div>

    <div class="ccm-filter-item">
      <label class="equip-filter-label" for="sort-order-filter">Ordenar</label>
      <select id="sort-order-filter" class="equip-filter-select">
        <option value="mais_novos" selected>Mais novos</option>
        <option value="mais_antigos">Mais antigos</option>
        <option value="criticidade">Criticidade</option>
      </select>
    </div>

    <button class="btn btn-ghost btn-sm" id="btn-clear-ccm-filters" type="button">Limpar filtros</button>
  </div>

  <!-- Queue -->
  <div id="ccm-queue">
    <div class="spinner-center"><div class="spinner"></div></div>
  </div>

  <div class="modal-backdrop" id="modal-aceite-ccm">
    <div class="modal ccm-aceite-modal">
      <div class="modal-header">
        <span class="modal-title">Aceite CCM e Preparação da Nota SAP</span>
        <button class="modal-close" id="btn-close-modal-aceite">✕</button>
      </div>
      <div class="modal-body ccm-aceite-body">
        <div class="ccm-aceite-grid-2">
          <div class="form-group">
            <label class="form-label" for="aceite-tipo-nota">Tipo de nota</label>
            <select id="aceite-tipo-nota" class="form-control">
              <option value="YE" selected>YE - Corretiva emergencial (impacto operacional)</option>
              <option value="YP">YP - Corretiva programada (sem impacto)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="aceite-centro-trabalho">Centro de trabalho</label>
            <select id="aceite-centro-trabalho" class="form-control"></select>
          </div>
        </div>

        <div class="ccm-aceite-grid-2">
          <div class="form-group">
            <label class="form-label" for="aceite-sintoma">Sintoma da falha</label>
            <select id="aceite-sintoma" class="form-control"></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="aceite-prioridade">Prioridade SAP (CCM)</label>
            <select id="aceite-prioridade" class="form-control">
              <option value="">Selecione a prioridade</option>
              <option value="1">1 - Muito elevado</option>
              <option value="2">2 - Elevado</option>
              <option value="3">3 - Medio</option>
              <option value="4">4 - Baixo</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="aceite-texto-breve">Texto breve da nota</label>
          <div class="ccm-copy-row">
            <textarea id="aceite-texto-breve" class="form-control ccm-copy-textarea" rows="2"></textarea>
            <button class="btn btn-outline btn-sm" id="btn-copy-texto-breve" type="button">Copiar</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="aceite-texto-longo">Texto longo da nota</label>
          <div class="ccm-copy-row">
            <textarea id="aceite-texto-longo" class="form-control ccm-copy-textarea" rows="8"></textarea>
            <button class="btn btn-outline btn-sm" id="btn-copy-texto-longo" type="button">Copiar</button>
          </div>
        </div>

        <div class="ccm-aceite-grid-2 ccm-aceite-nota-ordem">
          <div class="form-group">
            <label class="form-label ccm-center" for="aceite-numero-nota">Nota</label>
            <input id="aceite-numero-nota" class="form-control ccm-center" maxlength="30" placeholder="Ex: 120123456789">
          </div>
          <div class="form-group">
            <label class="form-label ccm-center" for="aceite-numero-ordem">Ordem</label>
            <input id="aceite-numero-ordem" class="form-control ccm-center" maxlength="30" placeholder="Ex: 4101234567">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancelar-modal-aceite" type="button">Cancelar</button>
        <button class="btn btn-success" id="btn-gravar-modal-aceite" type="button">Gravar</button>
      </div>
    </div>
  </div>

</div>

<style>
/* ---- CCM Queue: grouped card layout ---- */
.ccm-group { margin-bottom: 1.75rem; }
.ccm-group-accordion { margin-bottom: .15rem; }
.ccm-searchable-select { position: relative; }
.ccm-searchable-input { min-height: 42px; height: 42px; font-size: .95rem; padding-right: 2.2rem; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position: calc(100% - 18px) 17px, calc(100% - 12px) 17px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
.ccm-searchable-menu { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
.ccm-searchable-option { padding: .55rem .75rem; font-size: .92rem; color: var(--text); cursor: pointer; border-bottom: 1px solid rgba(0,0,0,.04); }
.ccm-searchable-option:last-child { border-bottom: 0; }
.ccm-searchable-option:hover, .ccm-searchable-option.active { background: rgba(27,42,94,.08); }
.ccm-searchable-empty { padding: .55rem .75rem; font-size: .88rem; color: var(--text-muted); }
.native-select-hidden { display: none; }

.ccm-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .8rem;
  width: 100%;
  padding: .6rem 1rem;
  background: var(--primary);
  border: 0;
  color: #fff;
  border-radius: var(--radius) var(--radius) 0 0;
  font-weight: 700;
  font-size: .88rem;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}
.ccm-group-header-static {
  cursor: default;
}
.ccm-group-header-left {
  display: flex;
  align-items: center;
  gap: .45rem;
  min-width: 0;
}
.ccm-group-header-right {
  display: flex;
  align-items: center;
  gap: .55rem;
  white-space: nowrap;
}
.ccm-group-datetime {
  font-size: .78rem;
  font-weight: 600;
  opacity: .95;
}
.ccm-group-body {
  display: none;
}
.ccm-group-body.open {
  display: block;
}
.ccm-group-tools {
  display: flex;
  justify-content: flex-end;
  gap: .45rem;
  padding: .55rem .8rem;
  border: 1px solid var(--border);
  border-top: none;
  background: #f8fafc;
}
.ccm-date-range-wrap {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
}
.ccm-date-range-input {
  min-width: 280px;
}
.ccm-dup-header-btn.active {
  filter: saturate(1.2);
  box-shadow: 0 0 0 2px rgba(255,255,255,.28) inset;
}
.ccm-dup-confirm-btn {
  margin-left: .45rem;
  background: #f8fafc;
  color: #0f172a;
  border-color: #e2e8f0;
}
.ccm-dup-confirm-btn:hover {
  background: #ffffff;
  color: #0f172a;
  border-color: #ffffff;
}
.ccm-dup-confirm-btn:disabled {
  opacity: .55;
  background: rgba(248,250,252,.5);
  color: rgba(15,23,42,.85);
  border-color: rgba(226,232,240,.7);
}
.ccm-gcount {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 20px;
  padding: 0 7px;
  background: rgba(255,255,255,.18);
  border-radius: 99px;
  font-size: .72rem;
  font-weight: 700;
}
.ccm-gcount.pend { background: rgba(232,92,17,.85); }

.ccm-card {
  display: flex;
  align-items: flex-start;
  gap: 1.25rem;
  padding: 1.05rem 1.3rem;
  border: 1px solid var(--border);
  border-top: none;
  background: var(--bg);
  transition: background var(--trans);
}
.ccm-card:last-child { border-radius: 0 0 var(--radius) var(--radius); }
.ccm-card + .ccm-card { border-top: 1px solid var(--border-lt); }
.ccm-card:hover { background: var(--surface); }

/* Left: ticket + badges */
.ccm-card-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .35rem;
  width: 190px;
  flex-shrink: 0;
  padding-top: 2px;
}
/* Photo thumbnail */
.ccm-card-photo {
  width: 90px;
  flex-shrink: 0;
  align-self: flex-start;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.ccm-photo-img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: block;
  transition: opacity var(--trans);
  cursor: zoom-in;
}
.ccm-photo-img:hover { opacity: .82; }

/* Lightbox */
.ccm-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.88);
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
.ccm-lightbox.open { display: flex; }
.ccm-lightbox img {
  max-width: min(92vw, 1200px);
  max-height: 90dvh;
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
  object-fit: contain;
  cursor: default;
}
.ccm-lightbox-close {
  position: absolute;
  top: 1rem;
  right: 1.25rem;
  background: none;
  border: none;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
  line-height: 1;
  opacity: .8;
}
.ccm-lightbox-close:hover { opacity: 1; }
.ccm-photo-placeholder {
  width: 90px;
  height: 90px;
  border-radius: var(--radius);
  border: 1px dashed var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 1.4rem;
  color: var(--text-light);
  text-align: center;
}
.ccm-photo-placeholder span { font-size: .68rem; color: var(--text-light); }
/* Notificador name + area */
.ccm-notificador {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: .4rem;
}
.ccm-notif-nome {
  font-size: .8rem;
  font-weight: 600;
  color: var(--text);
}
.ccm-notif-area {
  font-size: .74rem;
  color: var(--text-muted);
  padding-left: 1.3em;
}
.ccm-notif-data {
  font-size: .74rem;
  color: var(--text-muted);
  padding-left: 1.3em;
}
.ccm-ticket {
  font-family: 'Courier New', monospace;
  font-size: 1rem;
  font-weight: 800;
  color: var(--primary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 8px;
  white-space: nowrap;
}

/* Center: content */
.ccm-card-content {
  flex: 1;
  min-width: 0;
}
.ccm-title {
  font-size: .95rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: .2rem;
}
.ccm-desc {
  font-size: .84rem;
  color: var(--text-muted);
  line-height: 1.28;
  margin-bottom: .35rem;
  white-space: normal;
  word-break: break-word;
}
.ccm-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem .75rem;
  font-size: .78rem;
  color: var(--text-muted);
  align-items: center;
}
.ccm-criticidade {
  margin: 0;
  padding: .5rem .55rem;
  border: 1px solid var(--border-lt);
  border-radius: var(--radius);
  background: var(--surface);
}
.ccm-criticidade.is-locked {
  opacity: 1;
  filter: none;
  background: #f3f4f6;
}
.ccm-criticidade-title {
  font-size: .74rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: .35rem;
}
.ccm-criticidade-options {
  display: flex;
  flex-direction: column;
  gap: .3rem;
}
.ccm-criticidade-option {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  font-size: .76rem;
  color: var(--text);
}
.ccm-criticidade-option.is-selected {
  font-weight: 700;
  color: var(--primary);
}
.ccm-motivo-box {
  font-size: .8rem;
  color: #92400e;
  background: #fffbeb;
  border-left: 3px solid var(--warning);
  padding: .35rem .6rem;
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-top: .5rem;
  font-style: italic;
}

.ccm-aceite-modal {
  width: min(920px, 96vw);
  max-width: 920px;
}
.ccm-aceite-body {
  max-height: min(72vh, 760px);
  overflow-y: auto;
}
.ccm-aceite-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .85rem;
}
.ccm-copy-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .5rem;
  align-items: start;
}
.ccm-copy-textarea {
  font-family: 'Courier New', monospace;
  line-height: 1.35;
  white-space: pre-wrap;
}
.ccm-aceite-nota-ordem .form-group {
  text-align: center;
}
.ccm-center {
  text-align: center;
}

/* Right: actions */
.ccm-card-actions {
  min-width: 360px;
  flex-shrink: 0;
}
.ccm-card-actions-row {
  display: flex;
  align-items: flex-start;
  gap: .75rem;
}
.ccm-criticidade-col {
  flex: 0 0 210px;
}
.ccm-action-buttons {
  flex: 1;
  min-width: 130px;
  display: flex;
  flex-direction: column;
  gap: .55rem;
}
.ccm-action-buttons.is-locked {
  opacity: .62;
}
.ccm-lock-note {
  font-size: .74rem;
  font-weight: 700;
  color: #6b7280;
  background: #f3f4f6;
  border: 1px solid #d1d5db;
  border-radius: var(--radius);
  padding: .25rem .45rem;
}
.ccm-recusa-form {
  display: flex;
  flex-direction: column;
  gap: .4rem;
  min-width: 200px;
}
.ccm-recusa-form textarea {
  width: 100%;
  min-height: 60px;
  font-size: .82rem;
  padding: .35rem .6rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  resize: vertical;
  font-family: inherit;
  color: var(--text);
  outline: none;
  background: var(--bg);
}
.ccm-recusa-form textarea:focus {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px rgba(220,38,38,.1);
}
.ccm-dup-check-wrap {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-top: .2rem;
  padding: .15rem 0;
  cursor: pointer;
  color: var(--text-muted);
  font-size: .8rem;
  font-weight: 600;
}
.ccm-dup-check-wrap input {
  width: 1.05rem;
  height: 1.05rem;
  accent-color: var(--primary);
  cursor: pointer;
}
.ccm-btn-danger-outline {
  background: transparent;
  color: var(--danger);
  border-color: var(--danger);
}
.ccm-btn-danger-outline:hover {
  background: rgba(220, 38, 38, .08);
  color: var(--danger);
  border-color: var(--danger);
}

/* CCM copy badges */
.ccm-copy-badge {
  border: 0;
  padding: .28rem .45rem;
  border-radius: 999px;
  font-size: .72rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform var(--trans), opacity var(--trans);
  white-space: nowrap;
}
.ccm-copy-badge:hover {
  transform: translateY(-1px);
  opacity: .92;
}

/* SAP badge variants */
.badge-sap-sim {
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
  font-size: .72rem;
}
.badge-sap-nao {
  background: var(--surface);
  color: var(--text-light);
  border: 1px solid var(--border);
  font-size: .72rem;
}
.badge-sap-sim.clickable,
.badge-sap-nao.clickable {
  cursor: pointer;
  user-select: none;
  transition: opacity var(--trans);
}
.badge-sap-sim.clickable:hover,
.badge-sap-nao.clickable:hover { opacity: .72; }

/* Equipment filter bar */
.equip-filter-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .65rem;
  margin-top: .5rem;
  margin-bottom: .25rem;
}
.ccm-filter-item {
  display: flex;
  align-items: center;
  gap: .4rem;
}
.ccm-advanced-filters {
  margin-bottom: .5rem;
}
.equip-filter-label {
  font-size: .82rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
}
.equip-filter-select {
  padding: .3rem .65rem;
  font-size: .84rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  outline: none;
  min-width: 220px;
}
.equip-filter-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.12);
}

@media (max-width: 900px) {
  .ccm-card {
    flex-wrap: wrap;
    gap: .9rem;
  }
  .ccm-card-meta {
    width: auto;
    min-width: 150px;
  }
  .ccm-card-actions {
    min-width: 100%;
    width: 100%;
  }
  .ccm-card-actions-row {
    flex-direction: column;
    gap: .6rem;
  }
  .ccm-criticidade-col {
    flex: 1 1 auto;
    width: 100%;
  }
}

@media (max-width: 640px) {
  .ccm-group-header {
    flex-wrap: wrap;
    row-gap: .5rem;
    padding: .55rem .75rem;
  }
  .ccm-group-header-left {
    width: 100%;
    flex-wrap: wrap;
    gap: .45rem;
  }
  .ccm-group-header-right {
    margin-left: 0;
    width: 100%;
    justify-content: flex-end;
  }
  .ccm-dup-confirm-btn {
    margin-left: .35rem;
  }
  .ccm-card {
    padding: .85rem .8rem;
    gap: .75rem;
  }
  .ccm-card-meta {
    min-width: 0;
    width: 100%;
    gap: .3rem;
  }
  .ccm-card-photo {
    width: 76px;
  }
  .ccm-photo-img,
  .ccm-photo-placeholder {
    width: 76px;
    height: 76px;
  }
  .ccm-card-content {
    width: calc(100% - 88px);
  }
  .ccm-title {
    font-size: .9rem;
  }
  .ccm-desc {
    font-size: .8rem;
  }
  .ccm-action-buttons,
  .ccm-recusa-form {
    min-width: 0;
  }
  .ccm-aceite-grid-2 {
    grid-template-columns: 1fr;
  }
  .ccm-copy-row {
    grid-template-columns: 1fr;
  }
}
</style>
{% endblock %}

{% block page_script %}
<script>
(function () {
  let allSafs      = [];
  let activeFilter = 'PENDENTES';
  let activeLine   = '';
  let activeStation = '';
  let activeOrderSearch = '';
  let activeOccurrenceSearchApproved = '';
  let activeDateFrom = '';
  let activeDateTo = '';
  let activeSortOrder = 'mais_novos';
  let estacoesCache = [];
  let estacaoById = new Map();
  let estacoesPorLinha = new Map();
  let subsistemasPorSistemaCache = new Map();
  let centrosTrabalhoCache = [];
  let aceiteSafAtual = null;
  let aceiteIdsDuplicadas = [];
  let sintomasModalCache = [];
  let dateRangePicker = null;
  const duplicateModeGroups = new Set();
  const duplicateSelections = new Map();
  const expandedGroups = new Set();
  let knownPendingIds = new Set();
  let pendingMonitorInitialized = false;
  let notificationAudioCtx = null;
  let notificationAudioUnlocked = false;

  function unlockNotificationAudio() {
    if (notificationAudioUnlocked) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) {
      notificationAudioUnlocked = true;
      return;
    }

    if (!notificationAudioCtx) notificationAudioCtx = new Ctx();

    const onReady = () => {
      notificationAudioUnlocked = true;
      document.removeEventListener('click', onReady);
      document.removeEventListener('keydown', onReady);
      document.removeEventListener('touchstart', onReady);
    };

    if (notificationAudioCtx.state === 'suspended') {
      notificationAudioCtx.resume().then(onReady).catch(() => {});
      return;
    }

    onReady();
  }

  function playNewPendingAlertSound() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;

    if (!notificationAudioCtx) notificationAudioCtx = new Ctx();
    if (notificationAudioCtx.state !== 'running') return;

    const now = notificationAudioCtx.currentTime;
    const pattern = [
      { t: 0.00, f: 1280, d: 0.14 },
      { t: 0.17, f: 920, d: 0.14 },
      { t: 0.34, f: 1280, d: 0.14 },
      { t: 0.51, f: 920, d: 0.20 },
    ];

    pattern.forEach(step => {
      const osc = notificationAudioCtx.createOscillator();
      const gain = notificationAudioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(step.f, now + step.t);

      gain.gain.setValueAtTime(0.0001, now + step.t);
      gain.gain.exponentialRampToValueAtTime(0.18, now + step.t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + step.t + step.d);

      osc.connect(gain);
      gain.connect(notificationAudioCtx.destination);
      osc.start(now + step.t);
      osc.stop(now + step.t + step.d + 0.01);
    });
  }

  function notifyNewPendingSafs(items) {
    const currentPendingIds = new Set(
      (items || [])
        .filter(s => s && s.status === 'ABERTA')
        .map(s => String(s.id || '').trim())
        .filter(Boolean)
    );

    if (!pendingMonitorInitialized) {
      knownPendingIds = currentPendingIds;
      pendingMonitorInitialized = true;
      return;
    }

    const newPendingCount = [...currentPendingIds].filter(id => !knownPendingIds.has(id)).length;
    knownPendingIds = currentPendingIds;

    if (newPendingCount <= 0) return;

    const msg = newPendingCount === 1
      ? 'Nova solicitacao pendente recebida na fila CCM.'
      : `${newPendingCount} novas solicitacoes pendentes recebidas na fila CCM.`;
    Toast.success(msg);
    playNewPendingAlertSound();
  }

  function parseOrderNumber(item) {
    const integ = item.saf_integracao_sap || {};
    return String(item.ccm_numero_ordem || integ.aufnr || integ.numero_ordem_sap || '').trim();
  }

  function parseOccurrenceNumber(item) {
    const direto = String(item?.numero_ocorrencia || '').trim();
    if (direto) return direto;
    const descricao = String(item?.descricao_longa || '');
    const m = descricao.match(/(?:^|\n)Numero da Ocorrencia:\s*([^\n\r]*)/i);
    return m && m[1] ? String(m[1]).trim() : '';
  }

  function formatSafTicket(item) {
    const raw = String(item?.ticket_saf || '').trim();
    if (raw) return `#${raw.padStart(6, '0')}`;
    const fallback = String(item?.id || '').trim().slice(0, 6).toUpperCase();
    return fallback ? `#${fallback}` : '#000000';
  }

  function parseOrderGroupMeta(item) {
    const ordem = parseOrderNumber(item);
    if (ordem) {
      return { key: `ordem:${ordem}`, title: ordem };
    }
    return { key: `saf:${String(item.id || '').trim()}`, title: formatSafTicket(item) };
  }

  function parseClassicGroupMeta(item) {
    const equip = String(item.equipamento || item.titulo_falha || 'Sem Equipamento').trim();
    return { key: `classic:${equip}`, title: equip };
  }

  function groupMatches(item, groupKey) {
    if (!groupKey) return false;
    if (groupKey.startsWith('classic:')) return parseClassicGroupMeta(item).key === groupKey;
    return parseOrderGroupMeta(item).key === groupKey;
  }

  function toDateKey(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    return d.toISOString().slice(0, 10);
  }

  function norm(v) {
    return String(v || '').trim().toLowerCase();
  }

  function parseLinha(item) {
    const est = estacaoById.get(String(item.local_instalacao_id || '').trim());
    if (est?.linha) return String(est.linha).trim();

    const local = String(item.local_instalacao || '');
    const lid = String(item.local_instalacao_id || '');
    const titulo = String(item.titulo_falha || '');
    const composed = `${local} ${lid} ${titulo}`;

    const mLinha = composed.match(/linha\s*(\d{1,2})/i);
    if (mLinha && mLinha[1]) return mLinha[1];

    const mTv = composed.match(/\bTV\s*([0-9]{2})\b/i);
    if (mTv && mTv[1]) return mTv[1];

    return '';
  }

  function parseEstacao(item) {
    const est = estacaoById.get(String(item.local_instalacao_id || '').trim());
    if (est?.estacao) return String(est.estacao).trim();

    const local = String(item.local_instalacao || '').trim();
    if (!local) return '';

    const m = local.match(/estac[aã]o\s+([^\-()]+)/i);
    if (m && m[1]) return String(m[1]).trim();

    return local;
  }

  function parseCriticidadeLevel(item) {
    const p = String(item?.prioridade || '').trim().toUpperCase();
    if (p === 'CRITICA' || p === 'CRÍTICA' || p === '1') return 1;
    if (p === 'ALTA' || p === '2') return 2;
    if (p === 'MEDIA' || p === 'MÉDIA' || p === '3') return 3;
    if (p === 'BAIXA' || p === '4') return 4;
    return 99;
  }

  function parseSortTimestamp(item) {
    const raw = item?.criado_em || item?.data_avaliacao || '';
    const t = raw ? new Date(raw).getTime() : NaN;
    return Number.isNaN(t) ? 0 : t;
  }

  function ordenarItensFila(items) {
    const lista = [...(items || [])];

    if (activeSortOrder === 'criticidade') {
      return lista.sort((a, b) => {
        const ca = parseCriticidadeLevel(a);
        const cb = parseCriticidadeLevel(b);
        if (ca !== cb) return ca - cb;
        return parseSortTimestamp(b) - parseSortTimestamp(a);
      });
    }

    if (activeSortOrder === 'mais_antigos') {
      return lista.sort((a, b) => parseSortTimestamp(a) - parseSortTimestamp(b));
    }

    return lista.sort((a, b) => parseSortTimestamp(b) - parseSortTimestamp(a));
  }

  function enrichSafForFilters(item) {
    const linha = parseLinha(item);
    const estacao = parseEstacao(item);
    const dataNotificacao = toDateKey(item.criado_em);
    const numeroOcorrencia = parseOccurrenceNumber(item);
    return {
      ...item,
      _linha: linha,
      _estacao: estacao,
      _data_notificacao: dataNotificacao,
      _numero_ocorrencia: numeroOcorrencia,
    };
  }

  function rebuildEstacaoLookup() {
    estacaoById = new Map();
    estacoesPorLinha = new Map();
    (estacoesCache || []).forEach(e => {
      const id = String(e.id || '').trim();
      const linha = String(e.linha || '').trim();
      const estacao = String(e.estacao || '').trim();
      const sigla = String(e.sigla || '').trim();
      if (!id) return;
      estacaoById.set(id, { linha, estacao, sigla });
      if (!linha || !estacao) return;
      if (!estacoesPorLinha.has(linha)) estacoesPorLinha.set(linha, new Set());
      estacoesPorLinha.get(linha).add(estacao);
    });
  }

  async function carregarCatalogoEstacoes() {
    const res = await API.estacoes();
    if (!res.ok) {
      estacoesCache = [];
      rebuildEstacaoLookup();
      return;
    }
    estacoesCache = res.data?.estacoes || [];
    rebuildEstacaoLookup();
  }

  // ───────── Stats ─────────
  function updateStats() {
    const c = { ABERTA: 0, APROVADA: 0, DEVOLVIDA: 0, CANCELADA: 0, DUPLICADA: 0 };
    allSafs.forEach(s => { if (c[s.status] !== undefined) c[s.status]++; });
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    set('s-pendentes',  c.ABERTA);
    set('s-aprovadas',  c.APROVADA);
    set('s-devolvidas', c.DEVOLVIDA);
    set('s-canceladas', c.CANCELADA);
    set('s-total',      allSafs.length);
    set('ccm-subtitle',
      c.ABERTA > 0
        ? `${c.ABERTA} solicitação(ões) aguardando avaliação`
        : 'Nenhuma solicitação pendente');
  }

  // ───────── Filter ─────────
  function getFiltered() {
    let items = allSafs;
    if (activeFilter === 'PENDENTES')  items = items.filter(s => s.status === 'ABERTA');
    else if (activeFilter === 'APROVADA')  items = items.filter(s => s.status === 'APROVADA');
    else if (activeFilter === 'DUPLICADA') items = items.filter(s => s.status === 'DUPLICADA');
    else if (activeFilter === 'CANCELADA') items = items.filter(s => s.status === 'CANCELADA');
    // TODAS: mostra tudo
    if (activeLine) items = items.filter(s => String(s._linha || '') === activeLine);
    if (activeStation) items = items.filter(s => norm(s._estacao) === norm(activeStation));
    if (activeOrderSearch) {
      const q = norm(activeOrderSearch);
      items = items.filter(s => norm(parseOrderNumber(s)).includes(q));
    }
    if (activeFilter === 'APROVADA' && activeOccurrenceSearchApproved) {
      const q = norm(activeOccurrenceSearchApproved);
      items = items.filter(s => norm(s._numero_ocorrencia).includes(q));
    }
    if (activeDateFrom) items = items.filter(s => {
      const d = String(s._data_notificacao || '');
      return d && d >= activeDateFrom;
    });
    if (activeDateTo) items = items.filter(s => {
      const d = String(s._data_notificacao || '');
      return d && d <= activeDateTo;
    });
    return items;
  }

  function populateLineFilter() {
    const sel = document.getElementById('line-filter');
    if (!sel) return;

    const linhasData = [...new Set(allSafs.map(s => String(s._linha || '').trim()).filter(Boolean))];
    const linhasCatalogo = [...estacoesPorLinha.keys()];
    const linhas = [...new Set([...linhasCatalogo, ...linhasData])]
      .sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));

    sel.innerHTML = '<option value="">Todas as linhas</option>' +
      linhas.map(l => `<option value="${l}">${l}</option>`).join('');

    if (linhas.includes(activeLine)) sel.value = activeLine;
    else activeLine = '';
  }

  function populateStationFilter() {
    const sel = document.getElementById('station-filter');
    if (!sel) return;

    const fromData = allSafs
      .filter(s => !activeLine || String(s._linha || '') === activeLine)
      .map(s => String(s._estacao || '').trim())
      .filter(Boolean);

    const fromCatalogo = activeLine && estacoesPorLinha.has(activeLine)
      ? [...estacoesPorLinha.get(activeLine)]
      : [];

    const estacoes = [...new Set([...fromCatalogo, ...fromData])]
      .sort((a, b) => a.localeCompare(b, 'pt-BR'));

    sel.innerHTML = '<option value="">Todas as estações</option>' +
      estacoes.map(e => `<option value="${escHtml(e)}">${escHtml(e)}</option>`).join('');

    if (estacoes.some(e => norm(e) === norm(activeStation))) {
      const matched = estacoes.find(e => norm(e) === norm(activeStation));
      sel.value = matched || '';
      activeStation = matched || '';
    } else {
      activeStation = '';
      sel.value = '';
    }
  }

  function syncFilterControls() {
    const orderSearchEl = document.getElementById('order-number-filter');
    const approvedOccurrenceSearchEl = document.getElementById('approved-occurrence-filter');
    const dateRangeEl = document.getElementById('date-range-filter');
    const sortOrderEl = document.getElementById('sort-order-filter');
    if (orderSearchEl) orderSearchEl.value = activeOrderSearch;
    if (approvedOccurrenceSearchEl) approvedOccurrenceSearchEl.value = activeOccurrenceSearchApproved;
    if (sortOrderEl) sortOrderEl.value = activeSortOrder;
    if (dateRangePicker) {
      const values = [];
      if (activeDateFrom) values.push(activeDateFrom);
      if (activeDateTo) values.push(activeDateTo);
      if (values.length) dateRangePicker.setDate(values, false);
      else dateRangePicker.clear(false);
    } else if (dateRangeEl) {
      dateRangeEl.value = activeDateFrom && activeDateTo
        ? `${activeDateFrom} ate ${activeDateTo}`
        : '';
    }
    syncApprovedOccurrenceFilterVisibility();
    populateLineFilter();
    populateStationFilter();
  }

  function syncApprovedOccurrenceFilterVisibility() {
    const wrap = document.getElementById('approved-occurrence-filter-wrap');
    if (!wrap) return;
    wrap.style.display = activeFilter === 'APROVADA' ? 'flex' : 'none';
  }

  function initDateRangePicker() {
    const input = document.getElementById('date-range-filter');
    if (!input || typeof flatpickr !== 'function') return;

    dateRangePicker = flatpickr(input, {
      mode: 'range',
      dateFormat: 'Y-m-d',
      altInput: true,
      altFormat: 'd/m/Y',
      locale: (flatpickr && flatpickr.l10ns && flatpickr.l10ns.pt) ? flatpickr.l10ns.pt : 'default',
      allowInput: false,
      clickOpens: true,
      onChange: function (selectedDates) {
        const toIso = (d) => d instanceof Date ? d.toISOString().slice(0, 10) : '';
        if (!selectedDates.length) {
          activeDateFrom = '';
          activeDateTo = '';
          renderQueue();
          return;
        }
        activeDateFrom = toIso(selectedDates[0]);
        activeDateTo = selectedDates[1] ? toIso(selectedDates[1]) : '';
        renderQueue();
      },
    });
  }

  function escHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDescricaoComOcorrencia(texto) {
    const normalized = String(texto || '')
      .replace(/\r/g, '')
      .split('\n')
      .map(linha => linha.trim())
      .filter(Boolean)
      .join('\n');
    const escaped = escHtml(normalized);
    const highlighted = escaped.replace(
      /(Ocorr(?:e|ê)ncia com cliente:[^\n\r]*)/gi,
      '<strong style="color:#dc2626;font-weight:800;">$1</strong>'
    );
    return highlighted.replace(/\n/g, '<br>');
  }

  async function copiarValorParaClipboard(valor, label) {
    const texto = String(valor || '').trim();
    if (!texto) {
      Toast.warning(`Nenhum ${label} disponível para copiar.`);
      return;
    }

    try {
      await navigator.clipboard.writeText(texto);
      Toast.success(`${label} copiado.`);
    } catch (_err) {
      Toast.error(`Não foi possível copiar ${label}.`);
    }
  }

  function bindCopyActions(container) {
    container?.querySelectorAll('[data-copy-value]').forEach(el => {
      el.addEventListener('click', () => {
        copiarValorParaClipboard(el.dataset.copyValue, el.dataset.copyLabel || 'valor');
      });
    });
  }

  // ───────── Render ─────────
  function renderQueue() {
    const container = document.getElementById('ccm-queue');
    const items = ordenarItensFila(getFiltered());

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">&#128235;</div>
          <p class="empty-state-title">Nenhuma solicitação</p>
          <p class="empty-state-text">Não há itens para o filtro selecionado.</p>
        </div>`;
      return;
    }

    const itensExpansiveis = items.filter(s => s.status === 'APROVADA');
    const itensComuns = items.filter(s => s.status !== 'APROVADA');
    const blocos = [];

    if (itensComuns.length) {
      const classicGroups = new Map();
      itensComuns.forEach(item => {
        const meta = item.status === 'APROVADA'
          ? parseOrderGroupMeta(item)
          : parseClassicGroupMeta(item);
        if (!classicGroups.has(meta.key)) classicGroups.set(meta.key, { title: meta.title, items: [] });
        classicGroups.get(meta.key).items.push(item);
      });
      const sortedClassic = [...classicGroups.entries()].sort(([, a], [, b]) => {
        const ta = Math.max(...a.items.map(parseSortTimestamp));
        const tb = Math.max(...b.items.map(parseSortTimestamp));
        if (activeSortOrder === 'mais_antigos') return ta - tb;
        if (activeSortOrder === 'criticidade') {
          const ca = Math.min(...a.items.map(parseCriticidadeLevel));
          const cb = Math.min(...b.items.map(parseCriticidadeLevel));
          if (ca !== cb) return ca - cb;
        }
        return tb - ta;
      });
      blocos.push(...sortedClassic.map(([groupKey, groupData]) => renderClassicGroup(groupKey, groupData.title, groupData.items)));
    }

    if (itensExpansiveis.length) {
      const groups = new Map();
      itensExpansiveis.forEach(item => {
        const meta = parseOrderGroupMeta(item);
        if (!groups.has(meta.key)) groups.set(meta.key, { title: meta.title, items: [] });
        groups.get(meta.key).items.push(item);
      });
      const sorted = [...groups.entries()].sort(([, a], [, b]) => {
        const ta = Math.max(...a.items.map(parseSortTimestamp));
        const tb = Math.max(...b.items.map(parseSortTimestamp));
        if (activeSortOrder === 'mais_antigos') return ta - tb;
        if (activeSortOrder === 'criticidade') {
          const ca = Math.min(...a.items.map(parseCriticidadeLevel));
          const cb = Math.min(...b.items.map(parseCriticidadeLevel));
          if (ca !== cb) return ca - cb;
        }
        return tb - ta;
      });
      blocos.push(...sorted.map(([groupKey, groupData]) => renderGroup(groupKey, groupData.title, groupData.items)));
    }

    container.innerHTML = blocos.join('');
    bindCopyActions(container);

    container.querySelectorAll('.js-group-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const groupKey = decodeURIComponent(btn.dataset.group || '');
        if (!groupKey) return;
        if (expandedGroups.has(groupKey)) expandedGroups.delete(groupKey);
        else expandedGroups.add(groupKey);
        renderQueue();
      });
    });

    container.querySelectorAll('.js-dup-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const groupKey = decodeURIComponent(btn.dataset.group || '');
        toggleDuplicadoGroup(groupKey);
      });
    });

    container.querySelectorAll('.js-dup-confirm').forEach(btn => {
      btn.addEventListener('click', () => {
        const groupKey = decodeURIComponent(btn.dataset.group || '');
        confirmarDuplicadasGrupo(groupKey);
      });
    });
  }

  function getSelectionSet(groupKey) {
    if (!duplicateSelections.has(groupKey)) duplicateSelections.set(groupKey, new Set());
    return duplicateSelections.get(groupKey);
  }

  function renderGroup(groupKey, groupTitle, items) {
    const pend = items.filter(x => x.status === 'ABERTA').length;
    const selectedCount = items.filter(x => x.status === 'ABERTA' && getSelectionSet(groupKey).has(x.id)).length;
    const dupMode = duplicateModeGroups.has(groupKey);
    const isExpanded = expandedGroups.has(groupKey);
    const hasGrouping = items.length > 1;
    const dtRef = items
      .map(i => i.data_avaliacao || i.criado_em)
      .filter(Boolean)
      .sort()
      .pop();
    const dtLabel = dtRef ? Fmt.datetime(dtRef) : 'Sem data';
    const duplicadoBtn = hasGrouping && pend > 0
      ? `<button class="btn btn-warning btn-sm ccm-dup-header-btn ${dupMode ? 'active' : ''} js-dup-toggle" data-group="${encodeURIComponent(groupKey)}">Possível duplicata</button>`
      : '';
    const confirmarSelecaoBtn = dupMode
      ? `<button class="btn btn-outline btn-sm ccm-dup-confirm-btn js-dup-confirm" data-group="${encodeURIComponent(groupKey)}" ${selectedCount === 0 ? 'disabled' : ''}>Confirmar seleção${selectedCount > 0 ? ` (${selectedCount})` : ''}</button>`
      : '';
    return `
      <div class="ccm-group ccm-group-accordion">
        <button type="button" class="ccm-group-header js-group-toggle" data-group="${encodeURIComponent(groupKey)}" aria-expanded="${isExpanded ? 'true' : 'false'}">
          <div class="ccm-group-header-left">
            <span>${escHtml(groupTitle)}</span>
          </div>
          <div class="ccm-group-header-right">
            <span class="ccm-group-datetime">${escHtml(dtLabel)}</span>
          </div>
        </button>
        <div class="ccm-group-body ${isExpanded ? 'open' : ''}">
          ${(duplicadoBtn || confirmarSelecaoBtn) ? `<div class="ccm-group-tools">${duplicadoBtn}${confirmarSelecaoBtn}</div>` : ''}
          ${items.map(item => renderCard(item, groupKey)).join('')}
        </div>
      </div>`;
  }

  function renderClassicGroup(groupKey, groupTitle, items) {
    const pend = items.filter(x => x.status === 'ABERTA').length;
    const selectedCount = items.filter(x => x.status === 'ABERTA' && getSelectionSet(groupKey).has(x.id)).length;
    const dupMode = duplicateModeGroups.has(groupKey);
    const hasGrouping = items.length > 1;
    const pendBadge = pend > 0
      ? `<span class="ccm-gcount pend">${pend} pendente${pend > 1 ? 's' : ''}</span>`
      : '';
    const duplicadoBtn = hasGrouping && pend > 0
      ? `<button class="btn btn-warning btn-sm ccm-dup-header-btn ${dupMode ? 'active' : ''} js-dup-toggle" data-group="${encodeURIComponent(groupKey)}">Possível duplicata</button>`
      : '';
    const confirmarSelecaoBtn = dupMode
      ? `<button class="btn btn-outline btn-sm ccm-dup-confirm-btn js-dup-confirm" data-group="${encodeURIComponent(groupKey)}" ${selectedCount === 0 ? 'disabled' : ''}>Confirmar seleção${selectedCount > 0 ? ` (${selectedCount})` : ''}</button>`
      : '';

    return `
      <div class="ccm-group">
        <div class="ccm-group-header ccm-group-header-static">
          <div class="ccm-group-header-left">
            <span>&#9874; ${escHtml(groupTitle)}</span>
            ${pendBadge}
            <span class="ccm-gcount">${items.length} total</span>
          </div>
          <div class="ccm-group-header-right">${duplicadoBtn}${confirmarSelecaoBtn}</div>
        </div>
        <div class="ccm-group-body open">
          ${items.map(item => renderCard(item, groupKey)).join('')}
        </div>
      </div>`;
  }

  function renderCard(item, groupKey) {
    const saf    = item;
    const integ  = item.saf_integracao_sap || {};
    const id     = item.id;
    const status = item.status;
    const isEditable = status === 'ABERTA';
    const ticket = saf.ticket_saf ? `#${String(saf.ticket_saf).padStart(7, '0')}` : `#${id.substring(0, 7).toUpperCase()}`;
    let inicioFalhaTxt = '';
    if (saf.data_inicio_avaria) {
      const [ano, mes, dia] = saf.data_inicio_avaria.split('-');
      const hora = saf.hora_inicio_avaria ? saf.hora_inicio_avaria.substring(0,5) : '';
      inicioFalhaTxt = hora ? `${dia}/${mes}/${ano} ${hora}` : `${dia}/${mes}/${ano}`;
    }

    const notificadorHtml = saf.notificador_nome
      ? `<div class="ccm-notificador"><span class="ccm-notif-nome">&#128100; ${escHtml(saf.notificador_nome)}</span>${saf.notificador_area ? `<span class="ccm-notif-area">${escHtml(saf.notificador_area)}</span>` : ''}${inicioFalhaTxt ? `<span class="ccm-notif-data">${escHtml(inicioFalhaTxt)}</span>` : ''}</div>`
      : '';
    const aprovadorNome = String(saf.aprovador_nome || '').trim();
    const dataAvaliacao = item.data_avaliacao ? Fmt.datetime(item.data_avaliacao) : '';
    const aprovadorHtml = (status === 'APROVADA' && (aprovadorNome || dataAvaliacao))
      ? `<div class="ccm-notificador"><span class="ccm-notif-nome">&#128221; ${escHtml(aprovadorNome || 'Aprovador não informado')}</span><span class="ccm-notif-area">Aprovador</span>${dataAvaliacao ? `<span class="ccm-notif-data">${escHtml(`Aprovado em ${dataAvaliacao}`)}</span>` : ''}</div>`
      : '';
    const prio = String(saf.prioridade || '').toUpperCase();
    const criticidade = prio === 'CRITICA' || prio === 'CRÍTICA' || prio === '1' ? 1
      : prio === 'ALTA' || prio === '2' ? 2
      : prio === 'MEDIA' || prio === 'MÉDIA' || prio === '3' ? 3
      : prio === 'BAIXA' || prio === '4' ? 4
      : null;
    const numeroNota = String(saf.ccm_numero_nota || integ.qmnum || '').trim();
    const numeroOrdem = String(saf.ccm_numero_ordem || integ.aufnr || integ.numero_ordem_sap || '').trim();
    const numeroOcorrencia = String(saf._numero_ocorrencia || '').trim();
    const textoLongoAprovacao = String(
      saf.ccm_texto_longo_nota ||
      integ.texto_longo_nota ||
      ''
    ).trim();
    const centroTrabalhoAprovacao = String(saf.ccm_centro_trabalho || '').trim() || '—';
    const sintomaAprovacao = String(
      saf.sintoma_descricao ||
      readDescricaoCampo(textoLongoAprovacao, 'SINTOMA') ||
      readDescricaoCampo(textoLongoAprovacao, 'Sintoma') ||
      readDescricaoCampo(saf.descricao_longa, 'Sintoma') ||
      ''
    ).trim() || '—';
    const prioridadeAprovacao = String(saf.prioridade || '').trim() || '—';
    const notaAprovacao = numeroNota || '—';
    const ordemAprovacao = numeroOrdem || '—';
    const tituloCard = status === 'APROVADA' && !numeroOrdem
      ? `SAF ${ticket}`
      : (saf.titulo_falha || '—');
    const criticidadeTexto = descricaoCriticidadePadrao(String(criticidade || ''));
    const criticidadeHtml = `
      <div class="ccm-criticidade is-locked">
        <div class="ccm-criticidade-title">Criticidade (informada na SAF)</div>
        <div class="ccm-criticidade-options">
          <span class="ccm-criticidade-option is-selected">&#9679; ${escHtml(criticidadeTexto)}</span>
        </div>
      </div>`;

    // Badges de Nota/Ordem na área superior do card
    let qmnumBadge = '';
    let ordemBadge = '';
    let duplicadaBadge = '';

    const isDuplicadaVisual = Boolean(saf.is_duplicada || saf.qmnum_duplicata || status === 'DUPLICADA');
    duplicadaBadge = isDuplicadaVisual
      ? `<span class="badge" style="background:#f59e0b;color:#fff;" title="Solicitação marcada como duplicada">Duplicada</span>`
      : '';

    if (status === 'APROVADA' && (numeroNota || numeroOrdem)) {
      if (numeroNota) {
        qmnumBadge = `<button type="button" class="ccm-copy-badge" data-copy-value="${escHtml(numeroNota)}" data-copy-label="número da nota" style="background:#1e3a5f;color:#fff;font-family:monospace;letter-spacing:.04em;" title="Copiar número da nota">Nota: ${escHtml(numeroNota)}</button>`;
      }
      if (numeroOrdem) {
        ordemBadge = `<button type="button" class="ccm-copy-badge" data-copy-value="${escHtml(numeroOrdem)}" data-copy-label="número da ordem" style="background:#0f766e;color:#fff;font-family:monospace;letter-spacing:.04em;" title="Copiar número da ordem">Ordem: ${escHtml(numeroOrdem)}</button>`;
      }
    } else if (integ.status_integracao === 'ERRO') {
      qmnumBadge = `<span class="badge" style="background:#7f1d1d;color:#fff;" title="Erro na integração SAP: ${integ.mensagem_erro || ''}">&#9888; SAP ERRO</span>`;
    }

    // Meta info row
    const metaParts = [];
    if (saf.local_instalacao) metaParts.push(`${saf.local_instalacao}`);
    if (numeroOcorrencia) metaParts.push(`Ocorrência: ${numeroOcorrencia}`);
    if (item.data_avaliacao) metaParts.push(`&#128197; ${Fmt.datetime(item.data_avaliacao)}`);

    // Action buttons
    let actionsHtml;
    if (status === 'ABERTA') {
      const checked = getSelectionSet(groupKey).has(id) ? 'checked' : '';
      const dupCheck = duplicateModeGroups.has(groupKey)
        ? `<label class="ccm-dup-check-wrap"><input type="checkbox" id="dup-check-${id}" ${checked} onchange="window._ccmToggleDuplicadaItem('${id}', '${encodeURIComponent(groupKey)}', this.checked)"> Selecionar para duplicada</label>`
        : '';
      actionsHtml = `
        <button class="btn btn-success btn-sm" onclick="window._ccmMostrarAceite('${id}')">&#10003; Aceitar</button>
        <button class="btn btn-sm ccm-btn-danger-outline" onclick="window._ccmMostrarRecusa('${id}')">&#10007; Recusar</button>
        ${dupCheck}`;
    } else if (status === 'APROVADA') {
      actionsHtml = `<button class="btn btn-outline btn-sm" onclick="window._ccmMostrarAceite('${id}')">✏️ Editar</button>`;
    } else if (status === 'DEVOLVIDA') {
      actionsHtml = `<span style="font-size:.8rem;color:var(--warning);font-weight:600;">&#8617; Devolvida</span>`;
    } else if (status === 'CANCELADA') {
      actionsHtml = `<span style="font-size:.8rem;color:var(--text-muted);font-weight:600;">&#10006; Cancelada</span>`;
    } else if (status === 'DUPLICADA') {
      const refNota = item.qmnum_duplicata ? ` — Nota ${item.qmnum_duplicata}` : '';
      actionsHtml = `<span style="font-size:.8rem;color:#6b7280;font-weight:600;">&#9632; Duplicata${refNota}</span>`;
    } else {
      actionsHtml = Fmt.statusBadge(status);
    }

    // Motivo devolução / cancelamento
    const motivoHtml = (status === 'DEVOLVIDA' && item.motivo_devolucao)
      ? `<div class="ccm-motivo-box">&#8617; <em>Motivo:</em> ${item.motivo_devolucao}</div>`
      : (status === 'CANCELADA' && item.motivo_cancelamento)
      ? `<div class="ccm-motivo-box" style="color:#7f1d1d;background:#fff1f2;border-color:#f87171;">&#10006; <em>Cancelamento:</em> ${item.motivo_cancelamento}</div>`
      : '';

    const conteudoCardAprovada = (status === 'APROVADA')
      ? `
          <div class="ccm-meta-row" style="display:block;line-height:1.45;">
            <div><strong>Centro de trabalho:</strong> ${escHtml(centroTrabalhoAprovacao)}</div>
            <div><strong>Sintoma:</strong> ${escHtml(sintomaAprovacao)}</div>
            <div><strong>Prioridade:</strong> ${escHtml(prioridadeAprovacao)}</div>
            <div><strong>Nota:</strong> ${escHtml(notaAprovacao)}</div>
            <div><strong>Ordem:</strong> ${escHtml(ordemAprovacao)}</div>
          </div>
          <div class="ccm-desc">${formatDescricaoComOcorrencia(textoLongoAprovacao || saf.descricao_longa || '—')}</div>
        `
      : `
          <div class="ccm-title">${tituloCard}</div>
          ${saf.descricao_longa ? `<div class="ccm-desc">${formatDescricaoComOcorrencia(saf.descricao_longa)}</div>` : ''}
          <div class="ccm-meta-row">
            ${metaParts.map(p => `<span>${p}</span>`).join('')}
          </div>
          ${motivoHtml}
        `;

    return `
      <div class="ccm-card" id="card-${id}">
        <div class="ccm-card-meta">
          <span class="ccm-ticket">${ticket}</span>
          ${notificadorHtml}
          ${aprovadorHtml}
          ${qmnumBadge}
          ${ordemBadge}
          ${duplicadaBadge}
        </div>
        <div class="ccm-card-photo">
          ${saf.anexo_evidencia_url
            ? `<img src="${saf.anexo_evidencia_url}" class="ccm-photo-img" alt="Evid\xeancia" loading="lazy"
                 onclick="window._ccmOpenLightbox('${saf.anexo_evidencia_url}')" title="Ampliar foto">`
            : `<div class="ccm-photo-placeholder">&#128247;<br><span>Sem foto</span></div>`
          }
          ${saf.foto_lat && saf.foto_lng
            ? `<a href="https://www.google.com/maps?q=${saf.foto_lat},${saf.foto_lng}&z=17"
                  target="_blank" rel="noopener noreferrer"
                  style="display:flex;align-items:center;justify-content:center;gap:3px;
                         font-size:.69rem;font-weight:600;color:var(--primary);
                         text-decoration:none;margin-top:5px;white-space:nowrap;"
                  title="Ver localização da foto no Google Maps">
                &#127759; Ver no Mapa
              </a>`
            : ''
          }
        </div>
        <div class="ccm-card-content">
          ${conteudoCardAprovada}
        </div>
        <div class="ccm-card-actions">
          <div class="ccm-card-actions-row">
            <div class="ccm-criticidade-col">${criticidadeHtml}</div>
            <div class="ccm-action-buttons" id="actions-${id}">${actionsHtml}</div>
          </div>
        </div>
      </div>`;
  }

  // ───────── Actions ─────────
  function nivelToPrioridade(nivel) {
    if (String(nivel) === '1') return 'CRITICA';
    if (String(nivel) === '2') return 'ALTA';
    if (String(nivel) === '3') return 'MEDIA';
    if (String(nivel) === '4') return 'BAIXA';
    return 'MEDIA';
  }

  function prioridadeToNivelSap(prioridade) {
    const p = String(prioridade || '').trim().toUpperCase();
    if (p === 'CRITICA' || p === 'CRÍTICA' || p === '1') return '1';
    if (p === 'ALTA' || p === '2') return '2';
    if (p === 'MEDIA' || p === 'MÉDIA' || p === '3') return '3';
    if (p === 'BAIXA' || p === '4') return '4';
    return '';
  }

  function descricaoCriticidadePadrao(nivel) {
    if (String(nivel) === '1') return '1 - BAIXA IMEDIATA DE SERVIÇO (TREM PARADO)';
    if (String(nivel) === '2') return '2 - SUPRESSÃO CONSEQUENTE (OPERAÇÃO DEGRADADA)';
    if (String(nivel) === '3') return '3 - IMPACTO CONTRATUAL (INDICADORES EST e MRO)';
    if (String(nivel) === '4') return '4 - ATENDIMENTO PROGRAMÁVEL (PCM)';
    return 'N/I';
  }

  function sanitizeSegment(value, fallback = 'N/I') {
    const txt = String(value || '').replace(/\s+/g, ' ').trim();
    if (!txt || txt === '-' || txt.toUpperCase() === 'NAO INFORMADO') return fallback;
    return txt;
  }

  function readDescricaoCampo(descricao, label) {
    const texto = String(descricao || '');
    if (!texto) return '';
    const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const rx = new RegExp(`(?:^|\\n)${escaped}:\\s*([^\\n\\r]*)`, 'i');
    const m = texto.match(rx);
    return m && m[1] ? String(m[1]).trim() : '';
  }

  function inferSistemaId(item) {
    const direct = String(item?.sistema_id || '').trim();
    if (direct) return direct;

    const local = String(item?.local_instalacao || '').trim();
    const localId = String(item?.local_instalacao_id || '').trim();
    const candidatos = [
      local.match(/TV\d{1,2}-([0-9]{1,2})(?:-|$)/i),
      localId.match(/TV\d{1,2}-([0-9]{1,2})(?:-|$)/i),
    ];
    const hit = candidatos.find(Boolean);
    return hit && hit[1] ? String(hit[1]).trim() : '';
  }

  function codigo3FromSubsistemaCodigo(codigo) {
    const raw = String(codigo || '').trim();
    if (!raw) return 'N/I';
    const norm = raw
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, '');
    return norm ? norm.slice(0, 3) : 'N/I';
  }

  function normalizeLocalToken(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9_\-]+/g, '_')
      .replace(/_+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function resolverLocalCurto(item) {
    const descricao = String(item?.descricao_longa || '');
    const local = String(item?.local_instalacao || '').trim().toUpperCase();
    const localId = String(item?.local_instalacao_id || '').trim().toUpperCase();

    const fromLocalEst = local.match(/-EST-([A-Z0-9_\-]+)/i);
    if (fromLocalEst && fromLocalEst[1]) {
      return sanitizeSegment(normalizeLocalToken(fromLocalEst[1]), 'N/I');
    }

    const fromLocalTrecho = local.match(/-([A-Z0-9]{2,}_[A-Z0-9]{2,})$/i);
    if (fromLocalTrecho && fromLocalTrecho[1]) {
      return sanitizeSegment(normalizeLocalToken(fromLocalTrecho[1]), 'N/I');
    }

    const fromLocalIdTrecho = localId.match(/([A-Z0-9]{2,}_[A-Z0-9]{2,})/i);
    if (fromLocalIdTrecho && fromLocalIdTrecho[1]) {
      return sanitizeSegment(normalizeLocalToken(fromLocalIdTrecho[1]), 'N/I');
    }

    const estacao = readDescricaoCampo(descricao, 'Estacao') || readDescricaoCampo(descricao, 'Estação');
    const estacaoSigla = String(estacao || '').match(/\(([A-Za-z0-9_\-]{2,})\)\s*$/);
    if (estacaoSigla && estacaoSigla[1]) {
      return sanitizeSegment(normalizeLocalToken(estacaoSigla[1]), 'N/I');
    }

    const trecho = readDescricaoCampo(descricao, 'Trecho');
    const trechoCode = String(trecho || '').match(/([A-Za-z0-9]{2,}_[A-Za-z0-9]{2,})/);
    if (trechoCode && trechoCode[1]) {
      return sanitizeSegment(normalizeLocalToken(trechoCode[1]), 'N/I');
    }

    return 'N/I';
  }

  function formatDataHoraBrasilNota(dateObj = new Date(), item = null) {
    const parts = new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false,
    }).formatToParts(dateObj);

    const byType = {};
    parts.forEach(p => { byType[p.type] = p.value; });

    const dd = byType.day || '00';
    const mm = byType.month || '00';
    const yyyy = byType.year || '0000';
    const hh = byType.hour || '00';
    const mi = byType.minute || '00';
    const ss = byType.second || '00';
    const solicitanteNome = String(item?.notificador_nome || item?.solicitante_nome || item?.nome_solicitante || '').trim();
    const identificador = solicitanteNome || 'S-SAF-TRIVIA';
    return `${dd}.${mm}.${yyyy} ${hh}:${mi}:${ss} BRAZIL (${identificador})`;
  }

  function nomeLinhaOficial(linha) {
    const map = {
      '11': 'CORAL',
      '12': 'SAFIRA',
      '13': 'JADE',
    };
    const cod = String(linha || '').trim();
    if (!cod) return 'LINHA N/I';
    const nome = map[cod] || '';
    return nome ? `LINHA ${cod} - ${nome}` : `LINHA ${cod}`;
  }

  function tipoLocalBySistema(sistemaId) {
    const sid = String(sistemaId || '').trim();
    if (sid === '1') return 'MRO';
    if (['2', '5', '7', '8'].includes(sid)) return 'Estação';
    if (['3', '4', '6'].includes(sid)) return 'Via';
    return 'N/I';
  }

  function resolverLocalDetalhado(item, tipoLocal) {
    if (tipoLocal === 'Estação') {
      const estRef = estacaoById.get(String(item.local_instalacao_id || '').trim()) || {};
      const descricao = String(item?.descricao_longa || '');
      const estCampo = readDescricaoCampo(descricao, 'Estacao') || readDescricaoCampo(descricao, 'Estação');
      const siglaByCampo = String(estCampo || '').match(/\(([A-Za-z0-9_\-]{2,})\)\s*$/);
      const nomeByCampo = String(estCampo || '').replace(/\s*\([^)]+\)\s*$/, '').trim();

      const sigla = (siglaByCampo && siglaByCampo[1])
        ? normalizeLocalToken(siglaByCampo[1])
        : normalizeLocalToken(estRef.sigla || resolverLocalCurto(item));
      const nome = String(nomeByCampo || estRef.estacao || item._estacao || '').trim();

      if (sigla && nome) return `${sigla} - ${nome}`;
      if (sigla) return sigla;
      if (nome) return nome;
      return 'N/I';
    }

    if (tipoLocal === 'Via') {
      return sanitizeSegment(resolverLocalCurto(item), 'N/I');
    }

    if (tipoLocal === 'MRO') {
      const trem = readDescricaoCampo(String(item?.descricao_longa || ''), 'Trem');
      return sanitizeSegment(trem || item?.local_instalacao || item?.equipamento || '', 'N/I');
    }

    return sanitizeSegment(resolverLocalCurto(item), 'N/I');
  }

  async function listarSubsistemasPorSistemaCached(sistemaId) {
    const sid = String(sistemaId || '').trim();
    if (!sid) return [];

    const cached = subsistemasPorSistemaCache.get(sid);
    if (cached) return cached;

    const res = await API.subsistemas(Number(sid));
    const lista = res.ok ? (res.data?.subsistemas || []) : [];
    subsistemasPorSistemaCache.set(sid, lista);
    return lista;
  }

  async function resolverSubsistemaPorContexto(item, sistemaId) {
    if (!sistemaId) return { id: '', codigo: '' };

    const lista = await listarSubsistemasPorSistemaCached(sistemaId);
    if (!lista.length) return { id: '', codigo: '' };

    const fromItem = String(item?.subsistema_id || '').trim();
    if (fromItem) {
      const byId = lista.find(s => String(s.id || '').trim() === fromItem);
      if (byId) {
        return {
          id: String(byId.id || '').trim(),
          codigo: String(byId.codigo || '').trim(),
        };
      }
    }

    const subsistemaTexto = readDescricaoCampo(item?.descricao_longa, 'Subsistema');
    if (!subsistemaTexto) return { id: '', codigo: '' };

    const textoNorm = normalizeKey(subsistemaTexto);
    const textoHead = normalizeKey(String(subsistemaTexto).split('-')[0]);
    const match = lista.find(s => {
      const codigoNorm = normalizeKey(s.codigo || '');
      const nomeNorm = normalizeKey(s.nome || '');
      if (codigoNorm && (textoHead === codigoNorm || textoNorm.startsWith(codigoNorm))) return true;
      if (nomeNorm && textoNorm.includes(nomeNorm)) return true;
      return false;
    });

    return match
      ? { id: String(match.id || '').trim(), codigo: String(match.codigo || '').trim() }
      : { id: '', codigo: '' };
  }

  function contextoTextoBreve(item) {
    const descricao = String(item?.descricao_longa || '');
    const trem = readDescricaoCampo(descricao, 'Trem');
    const viaNumero = String(item?.via_numero || readDescricaoCampo(descricao, 'Via') || '').trim();
    const kmInicial = String(item?.km_inicial || readDescricaoCampo(descricao, 'KM Inicial') || '').trim();

    return {
      sistemaId: inferSistemaId(item),
      subs3: sanitizeSegment(item?._subsistemaCodigo3 || '', 'N/I'),
      localCurto: resolverLocalCurto(item),
      trem: sanitizeSegment(trem, 'TREM'),
      viaNumero: sanitizeSegment(viaNumero, 'N/I'),
      kmInicial: sanitizeSegment(kmInicial, 'N/I'),
    };
  }

  function normalizeKey(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  async function carregarSintomasPorSistemaSubsistema(item) {
    const sistemaId = String(item?.sistema_id || inferSistemaId(item) || '').trim();
    if (!sistemaId) return [];

    const subsistema = await resolverSubsistemaPorContexto(item, sistemaId);
    const subsistemaId = subsistema.id;
    item._subsistemaCodigo3 = codigo3FromSubsistemaCodigo(subsistema.codigo);

    const res = await API.falhas({
      sistema_id: sistemaId,
      subsistema_id: subsistemaId || undefined,
    });

    if (!res.ok) return [];

    const falhas = res.data?.falhas || [];
    return falhas
      .map(f => ({
        id: String(f.id || '').trim(),
        descricao: String(f.descricao || '').trim(),
        codigo: String(f.grupo_codigo || '').trim(),
      }))
      .filter(f => f.id && f.descricao);
  }

  function montarTextoBreveNota(item, tipoNota, sintomaDescricao) {
    const ctx = contextoTextoBreve(item);
    const sistemaId = String(ctx.sistemaId || '').trim();
    const sintoma = sanitizeSegment(sintomaDescricao || item.titulo_falha || 'Falha');

    if (sistemaId === '1') {
      return `${ctx.trem} - ${sintoma}`.slice(0, 500);
    }
    if (['2', '5', '7', '8'].includes(sistemaId)) {
      return `${ctx.subs3} - ${ctx.localCurto} - ${sintoma}`.slice(0, 500);
    }
    if (['3', '4'].includes(sistemaId)) {
      return `${ctx.subs3} - ${ctx.localCurto} - ${ctx.kmInicial} - ${sintoma}`.slice(0, 500);
    }
    if (sistemaId === '6') {
      return `${ctx.subs3} - ${ctx.localCurto} - VIA ${ctx.viaNumero} - ${ctx.kmInicial} - ${sintoma}`.slice(0, 500);
    }

    return `${ctx.subs3} - ${ctx.localCurto} - ${sintoma}`.slice(0, 500);
  }

  function montarTextoLongoNota(item, tipoNota, sintomaObj, sintomaDescricao) {
    const sistemaId = inferSistemaId(item);
    const tipoLocal = tipoLocalBySistema(sistemaId);
    const linhaNumero = parseLinha(item);
    const linhaOficial = nomeLinhaOficial(linhaNumero);
    const localDetalhado = resolverLocalDetalhado(item, tipoLocal);
    const equipamento = sanitizeSegment(item?.equipamento || 'N/I', 'N/I');
    const sintoma = sanitizeSegment(sintomaDescricao || sintomaObj?.descricao || item?.titulo_falha || 'N/I', 'N/I');
    const criticidadeTxt = descricaoCriticidadePadrao(prioridadeToNivelSap(item?.prioridade));
    const descricaoFalha = sanitizeSegment(
      readDescricaoCampo(String(item?.descricao_longa || ''), 'Descricao') || String(item?.descricao_longa || ''),
      'N/I'
    );
    const numeroSaf = String(item?.ticket_saf || '').trim();
    const prefixo = numeroSaf ? `#${numeroSaf.padStart(6, '0')} - ` : '';

    const linhaPrincipal = formatDataHoraBrasilNota(new Date(), item);
    const linhaDetalhes = `${prefixo}LINHA: ${linhaOficial}, TIPO LOCAL: ${tipoLocal}, LOCAL: ${localDetalhado}, EQUIPAMENTO: ${equipamento}, SINTOMA: ${sintoma}, CRITICIDADE: ${criticidadeTxt}, DESCRIÇÃO: ${descricaoFalha}`;

    return `${linhaPrincipal}\n${linhaDetalhes}`;
  }

  function initModalSearchableSelect(sel, emptyMessage) {
    if (!sel || sel.dataset.searchableInitialized === 'true') return;

    const wrapper = document.createElement('div');
    wrapper.className = 'ccm-searchable-select';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'form-control ccm-searchable-input';
    input.autocomplete = 'off';
    input.placeholder = '';

    const menu = document.createElement('div');
    menu.className = 'ccm-searchable-menu';
    menu.style.display = 'none';

    sel.classList.add('native-select-hidden');
    sel.insertAdjacentElement('afterend', wrapper);
    wrapper.appendChild(input);
    wrapper.appendChild(menu);

    function selectedLabel() {
      const selected = sel.options[sel.selectedIndex];
      return selected ? String(selected.text || '') : '';
    }

    function renderOptions(term = '') {
      const filter = String(term || '').trim().toLowerCase();
      const options = Array.from(sel.options)
        .filter(opt => String(opt.value || '').trim() !== '')
        .filter(opt => String(opt.text || '').toLowerCase().includes(filter));

      if (!options.length) {
        menu.innerHTML = `<div class="ccm-searchable-empty">${escHtml(emptyMessage || 'Nenhum item disponivel')}</div>`;
        return;
      }

      menu.innerHTML = options.map(opt => {
        const isActive = String(opt.value || '') === String(sel.value || '');
        return `<div class="ccm-searchable-option${isActive ? ' active' : ''}" data-value="${escHtml(opt.value)}">${escHtml(opt.text)}</div>`;
      }).join('');
    }

    function syncFromSelect() {
      input.value = selectedLabel();
      renderOptions(input.value);
    }

    input.addEventListener('focus', () => {
      renderOptions(input.value);
      menu.style.display = 'block';
      input.select();
    });

    input.addEventListener('input', () => {
      renderOptions(input.value);
      menu.style.display = 'block';
    });

    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        menu.style.display = 'none';
        input.value = selectedLabel();
      }
    });

    menu.addEventListener('mousedown', event => {
      const optionEl = event.target.closest('.ccm-searchable-option');
      if (!optionEl) return;
      const value = optionEl.getAttribute('data-value') || '';
      sel.value = value;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      syncFromSelect();
      menu.style.display = 'none';
      event.preventDefault();
    });

    sel.addEventListener('change', syncFromSelect);

    document.addEventListener('click', function closeOutside(event) {
      if (!event.target.closest('.ccm-searchable-select')) {
        menu.style.display = 'none';
      }
    });

    sel.dataset.searchableInitialized = 'true';
    syncFromSelect();
  }

  async function carregarSintomasModal(item, sintomaPreSelecionado) {
    const sel = document.getElementById('aceite-sintoma');
    if (!sel) return;
    initModalSearchableSelect(sel, 'Nenhum sintoma disponivel para sistema/subsistema');
    sel.innerHTML = '';
    sel.value = '';
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    sintomasModalCache = [];

    let sintomas = [];
    try {
      sintomas = await carregarSintomasPorSistemaSubsistema(item);
    } catch (_err) {
      sintomas = [];
    }

    let sintomasPorEquipamento = [];
    const equipamentoId = String(item?.equipamento_id || '').trim();
    if (equipamentoId) {
      const res = await API.sintomas(equipamentoId);
      if (res.ok) {
        sintomasPorEquipamento = (res.data?.sintomas || []).map(s => ({
          id: String(s.id || '').trim(),
          descricao: String(s.descricao || '').trim(),
          codigo: String(s.codigo || '').trim(),
        })).filter(s => s.id);
      }
    }

    const mapaSintomas = new Map();
    const origemPreferencial = sintomasPorEquipamento.length ? sintomasPorEquipamento : sintomas;
    const origemComplementar = sintomasPorEquipamento.length ? sintomas : [];
    [...origemPreferencial, ...origemComplementar].forEach(s => {
      const sid = String(s?.id || '').trim();
      if (!sid) return;
      if (!mapaSintomas.has(sid)) mapaSintomas.set(sid, s);
    });

    const sintomaFallbackDescricao = (() => {
      const textoLongo = String(item?.ccm_texto_longo_nota || item?.saf_integracao_sap?.texto_longo_nota || '');
      const m = textoLongo.match(/SINTOMA:\s*([^,\n\r]+)/i);
      return m && m[1] ? String(m[1]).trim() : '';
    })();

    if (sintomaPreSelecionado && !mapaSintomas.has(sintomaPreSelecionado)) {
      mapaSintomas.set(sintomaPreSelecionado, {
        id: sintomaPreSelecionado,
        descricao: sintomaFallbackDescricao || 'Sintoma selecionado',
        codigo: '',
      });
    }

    sintomasModalCache = [...mapaSintomas.values()];

    if (!sintomasModalCache.length) {
      sel.innerHTML = '';
      sel.value = '';
      sel.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }

    sel.innerHTML = sintomasModalCache
      .map(s => `<option value="${escHtml(s.id)}">${escHtml(s.descricao)}${s.codigo ? ` (${escHtml(s.codigo)})` : ''}</option>`)
      .join('');

    if (sintomaPreSelecionado && sintomasModalCache.some(s => s.id === sintomaPreSelecionado)) {
      sel.value = sintomaPreSelecionado;
    } else {
      sel.value = '';
    }
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }

  async function aceitar(id) {
    const user = Auth.getUser();
    const item = allSafs.find(s => String(s.id) === String(id));
    if (!item) {
      Toast.error('SAF nao encontrada para gravacao.');
      return;
    }

    const tipoNota = (document.getElementById('aceite-tipo-nota')?.value || 'YE').toUpperCase();
    const sintomaId = (document.getElementById('aceite-sintoma')?.value || '').trim();
    const sintomaDescricao = String(
      sintomasModalCache.find(s => String(s.id || '').trim() === sintomaId)?.descricao || ''
    ).trim();
    const textoBreve = (document.getElementById('aceite-texto-breve')?.value || '').trim();
    const textoLongo = (document.getElementById('aceite-texto-longo')?.value || '').trim();
    const qmnum = (document.getElementById('aceite-numero-nota')?.value || '').trim();
    const aufnr = (document.getElementById('aceite-numero-ordem')?.value || '').trim();
    const centroTrabalho = (document.getElementById('aceite-centro-trabalho')?.value || '').trim();
    const prioridadeNivel = (document.getElementById('aceite-prioridade')?.value || '').trim();

    if (!centroTrabalho) {
      Toast.warning('Selecione o centro de trabalho.');
      return;
    }
    if (!sintomaId) {
      Toast.warning('Selecione o sintoma da falha.');
      return;
    }
    if (!textoBreve) {
      Toast.warning('Informe o texto breve da nota.');
      return;
    }
    if (!textoLongo) {
      Toast.warning('Informe o texto longo da nota.');
      return;
    }
    if (!prioridadeNivel) {
      Toast.warning('Selecione a prioridade SAP.');
      return;
    }

    const prioridade = nivelToPrioridade(prioridadeNivel);
    const gravarBtn = document.getElementById('btn-gravar-modal-aceite');
    if (gravarBtn) {
      gravarBtn.disabled = true;
      gravarBtn.textContent = 'Gravando...';
    }

    const idsDuplicatas = aceiteIdsDuplicadas
      .map(String)
      .filter(Boolean)
      .filter(itemId => itemId !== String(id));

    const res = await API.avaliarSaf(id, {
      status: 'APROVADA',
      avaliador_id: user?.id,
      tipo_nota: tipoNota,
      prioridade,
      centro_trabalho: centroTrabalho,
      sintoma_id: sintomaId,
      sintoma_descricao: sintomaDescricao,
      texto_breve_nota: textoBreve,
      texto_longo_nota: textoLongo,
      qmnum,
      aufnr,
      ids_duplicatas: idsDuplicatas,
    });

    if (gravarBtn) {
      gravarBtn.disabled = false;
      gravarBtn.textContent = 'Gravar';
    }

    if (!res.ok) {
      Toast.error(res.data.erro || 'Erro ao aceitar a SAF.');
      return;
    }

    item.status = 'APROVADA';
    item.tipo_nota = tipoNota;
    item.sintoma_id = String(res.data?.sintoma_id || sintomaId || '').trim();
    item.ccm_texto_breve_nota = textoBreve;
    item.ccm_texto_longo_nota = textoLongo;
    item.ccm_numero_nota = qmnum;
    item.ccm_numero_ordem = aufnr;
    item.ccm_centro_trabalho = centroTrabalho;
    item.prioridade = prioridade;
    item.saf_integracao_sap = {
      ...(item.saf_integracao_sap || {}),
      qmnum: qmnum || null,
      aufnr: aufnr || null,
      numero_ordem_sap: aufnr || null,
      tipo_nota: tipoNota,
      texto_breve_nota: textoBreve,
      texto_longo_nota: textoLongo,
      status_integracao: qmnum ? 'SUCESSO' : 'PENDENTE',
    };

    const nDup = res.data.duplicatas || 0;
    if (nDup > 0) {
      const idsParaAtualizar = new Set(idsDuplicatas.map(String));
      allSafs.forEach(s => {
        if (!idsParaAtualizar.has(String(s.id))) return;
        s.status = 'APROVADA';
        s.is_duplicada = true;
        s.qmnum_duplicata = qmnum || res.data.qmnum || null;
        s.tipo_nota = tipoNota;
        s.ccm_texto_breve_nota = textoBreve;
        s.ccm_texto_longo_nota = textoLongo;
        s.ccm_numero_nota = qmnum;
        s.ccm_numero_ordem = aufnr;
        s.ccm_centro_trabalho = centroTrabalho;
        s.prioridade = prioridade;
      });
    }

    fecharModalAceite();
    updateStats();
    renderQueue();
    Toast.success(`SAF aceita e dados SAP gravados.${nDup > 0 ? ` ${nDup} duplicata(s) atualizada(s).` : ''}`);
  }

    const user = Auth.getUser();
    const res  = await API.avaliarSaf(id, {

  function toggleDuplicadoGroup(groupKey) {
    const hasOpen = allSafs.some(s => s.status === 'ABERTA' && groupMatches(s, groupKey));
    if (!hasOpen) {
      Toast.warning('Nao ha ordens abertas neste grupo.');
      return;
    }

    if (duplicateModeGroups.has(groupKey)) {
      duplicateModeGroups.delete(groupKey);
      duplicateSelections.delete(groupKey);
    } else {
      duplicateModeGroups.add(groupKey);
    }
    renderQueue();
  }

  function toggleDuplicadaItem(id, groupEncoded, checked) {
    const groupKey = decodeURIComponent(groupEncoded || '');
    const set = getSelectionSet(groupKey);
    if (checked) set.add(id);
    else set.delete(id);
    renderQueue();
  }

  async function executarDuplicadasGrupo(groupKey, idsLote) {
    const user = Auth.getUser();
    const res = await API.duplicarLote(idsLote, user?.id);
    if (!res.ok) {
      Toast.error(res.data.erro || 'Erro ao marcar ordens como duplicadas.');
      return;
    }

    const marcados = new Set((res.data.ids_marcados || []).map(String));
    allSafs.forEach(s => {
      if (marcados.has(String(s.id))) {
        s.status = 'DUPLICADA';
        s.data_avaliacao = new Date().toISOString();
      }
    });

    duplicateSelections.delete(groupKey);
    duplicateModeGroups.delete(groupKey);
    updateStats();
    renderQueue();
    Toast.success(`${res.data.total_marcado || marcados.size} ordem(ns) marcadas como duplicadas.`);
  }

  function confirmarDuplicadasGrupo(groupKey) {
    const selecionados = getSelectionSet(groupKey);
    const idsLote = allSafs
      .filter(s => s.status === 'ABERTA' && groupMatches(s, groupKey) && selecionados.has(s.id))
      .map(s => s.id);

    if (!idsLote.length) {
      Toast.warning('Selecione ao menos uma ordem para marcar como duplicada.');
      return;
    }

    const primeiroId = idsLote[0];
    mostrarAceite(primeiroId, { idsDuplicatas: idsLote });
  }

      if (e.target === this) fecharModalAceite();
    });

    document.getElementById('aceite-tipo-nota')?.addEventListener('change', function () {
      preencherTextosSugestao(true);
    });

    document.getElementById('aceite-sintoma')?.addEventListener('change', function () {
      preencherTextosSugestao(true);
    });

    document.getElementById('btn-copy-texto-breve')?.addEventListener('click', async function () {
      const valor = document.getElementById('aceite-texto-breve')?.value || '';
      if (!valor.trim()) {
        Toast.warning('Nao ha texto breve para copiar.');
        return;
      }
      try {
        await navigator.clipboard.writeText(valor);
        Toast.success('Texto breve copiado.');
      } catch (_err) {
        Toast.error('Nao foi possivel copiar o texto breve.');
      }
    });

    document.getElementById('btn-copy-texto-longo')?.addEventListener('click', async function () {
      const valor = document.getElementById('aceite-texto-longo')?.value || '';
      if (!valor.trim()) {
        Toast.warning('Nao ha texto longo para copiar.');
        return;
      }
      try {
        await navigator.clipboard.writeText(valor);
        Toast.success('Texto longo copiado.');
      } catch (_err) {
        Toast.error('Nao foi possivel copiar o texto longo.');
      }
    });

    document.getElementById('btn-gravar-modal-aceite')?.addEventListener('click', function () {
      if (!aceiteSafAtual?.id) {
        Toast.error('Nenhuma SAF selecionada para gravacao.');
        return;
      }
      aceitar(aceiteSafAtual.id);
    });

    document.getElementById('btn-refresh')?.addEventListener('click', () => {
      loadQueue(false);
    });

    carregarCatalogoEstacoes().finally(() => {
      loadQueue(false);
    });

    // Polling silencioso a cada 30 segundos
    setInterval(() => loadQueue(true), 30000);
  });
})();
</script>
{% endblock %}
