name: Validate App Version

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file not found."
            exit 1
          fi

          current_version=$(tr -d ' \n\r\t' < VERSION)

          if ! [[ "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Formato invalido em VERSION: $current_version"
            exit 1
          fi

          echo "Versao atual: $current_version"
